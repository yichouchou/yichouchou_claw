<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yichouchou_claw</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/styles/github.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/go.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/javascript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/json.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/bash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/xml.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/css.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/sql.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/yaml.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/shell.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #ffffff;
            color: #1a1a1a;
            height: 100vh;
            display: flex;
        }
        /* 侧边栏 */
        .sidebar {
            width: 260px;
            background: #f9f9f9;
            border-right: 1px solid #e5e5e5;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #e5e5e5;
        }
        .new-chat-btn {
            width: 100%;
            padding: 10px 16px;
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #374151;
            transition: all 0.2s;
        }
        .new-chat-btn:hover {
            background: #f3f4f6;
        }
        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .chat-list-item {
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            color: #4b5563;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .chat-list-item:hover {
            background: #f3f4f6;
        }
        .chat-list-item.active {
            background: #e5e7eb;
        }
        /* 主区域 */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .main-header {
            padding: 12px 24px;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .model-name {
            font-size: 16px;
            font-weight: 500;
            color: #1a1a1a;
        }
        /* 消息区 */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }
        .message-wrapper {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px 24px;
        }
        .message {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }
        .message.user {
            flex-direction: row-reverse;
        }
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 14px;
            font-weight: 500;
        }
        .avatar.user-avatar {
            background: #2563eb;
            color: white;
        }
        .avatar.assistant-avatar {
            background: #d97706;
            color: white;
        }
        .message-body {
            flex: 1;
            min-width: 0;
        }
        .message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            font-size: 13px;
            color: #6b7280;
        }
        .message.user .message-header {
            justify-content: flex-end;
        }
        .agent-tag {
            padding: 2px 6px;
            background: #dbeafe;
            color: #1d4ed8;
            border-radius: 4px;
            font-size: 11px;
        }
        .message-content {
            font-size: 15px;
            line-height: 1.75;
            color: #1f2937;
            word-break: break-word;
        }
        .message-content > *:first-child { margin-top: 0; }
        .message-content > *:last-child { margin-bottom: 0; }
        .message-content p {
            margin: 8px 0;
        }
        .message-content h1,
        .message-content h2,
        .message-content h3,
        .message-content h4,
        .message-content h5,
        .message-content h6 {
            margin: 18px 0 10px;
            font-weight: 600;
            line-height: 1.35;
            color: #111827;
        }
        .message-content h1 { font-size: 1.55em; padding-bottom: 6px; border-bottom: 1px solid #e5e7eb; }
        .message-content h2 { font-size: 1.35em; padding-bottom: 4px; border-bottom: 1px solid #f0f0f0; }
        .message-content h3 { font-size: 1.18em; }
        .message-content h4 { font-size: 1.05em; }
        .message-content h5 { font-size: 0.98em; }
        .message-content h6 { font-size: 0.92em; color: #4b5563; }
        .message-content ul,
        .message-content ol {
            margin: 8px 0;
            padding-left: 1.6em;
        }
        .message-content ul { list-style: disc; }
        .message-content ol { list-style: decimal; }
        .message-content li {
            margin: 4px 0;
        }
        .message-content li > ul,
        .message-content li > ol {
            margin: 4px 0;
        }
        /* 任务列表 */
        .message-content input[type="checkbox"] {
            margin-right: 6px;
            vertical-align: middle;
        }
        /* 引用 */
        .message-content blockquote {
            margin: 10px 0;
            padding: 8px 14px;
            border-left: 4px solid #d97706;
            background: #fff7ed;
            color: #4b5563;
            border-radius: 4px;
        }
        .message-content blockquote p { margin: 4px 0; }
        /* 行内代码 */
        .message-content code {
            background: #f3f4f6;
            color: #b45309;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 0.9em;
            word-break: break-word;
        }
        /* 代码块 */
        .message-content pre {
            background: #f6f8fa;
            padding: 14px 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 10px 0;
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.55;
            border: 1px solid #eaeef2;
        }
        .message-content pre code {
            background: transparent;
            color: inherit;
            padding: 0;
            font-size: inherit;
            border-radius: 0;
            white-space: pre;
        }
        /* 链接 */
        .message-content a {
            color: #d97706;
            text-decoration: none;
            border-bottom: 1px solid rgba(217, 119, 6, 0.35);
        }
        .message-content a:hover {
            border-bottom-color: #d97706;
        }
        /* 表格 */
        .message-content table {
            border-collapse: collapse;
            margin: 10px 0;
            width: 100%;
            font-size: 14px;
            overflow: hidden;
            border-radius: 6px;
            border: 1px solid #e5e7eb;
        }
        .message-content th,
        .message-content td {
            border: 1px solid #e5e7eb;
            padding: 8px 12px;
            text-align: left;
        }
        .message-content th {
            background: #f9fafb;
            font-weight: 600;
        }
        .message-content tr:nth-child(even) td {
            background: #fafafa;
        }
        /* 分隔线 */
        .message-content hr {
            border: none;
            border-top: 1px solid #e5e7eb;
            margin: 16px 0;
        }
        /* 加粗/斜体 */
        .message-content strong { font-weight: 600; color: #111827; }
        .message-content em { font-style: italic; }
        /* 删除线 */
        .message-content del { color: #9ca3af; }
        /* 图片 */
        .message-content img {
            max-width: 100%;
            border-radius: 6px;
            margin: 6px 0;
        }
        /* 代码块语言标签 */
        .code-block-wrapper {
            position: relative;
            margin: 10px 0;
        }
        .code-block-wrapper .code-lang {
            position: absolute;
            top: 6px;
            right: 10px;
            font-size: 11px;
            color: #6b7280;
            background: rgba(255, 255, 255, 0.85);
            padding: 1px 6px;
            border-radius: 3px;
            font-family: 'Monaco', 'Menlo', monospace;
            text-transform: lowercase;
            pointer-events: none;
        }
        /* 思考过程 */
        .thinking-block {
            margin: 12px 0;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: #fafafa;
        }
        .thinking-header {
            padding: 10px 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #6b7280;
            user-select: none;
        }
        .thinking-header:hover {
            background: #f3f4f6;
        }
        .thinking-icon {
            transition: transform 0.2s;
        }
        .thinking-block:not(.collapsed) .thinking-icon {
            transform: rotate(90deg);
        }
        .thinking-block.collapsed .thinking-body {
            display: none;
        }
        .thinking-body {
            padding: 0 14px 12px 14px;
            font-size: 13px;
            color: #6b7280;
            line-height: 1.6;
        }
        .thinking-body > *:first-child { margin-top: 0; }
        .thinking-body > *:last-child { margin-bottom: 0; }
        .thinking-body p { margin: 6px 0; }
        .thinking-body h1,
        .thinking-body h2,
        .thinking-body h3,
        .thinking-body h4,
        .thinking-body h5,
        .thinking-body h6 { margin: 12px 0 6px; font-weight: 600; color: #374151; }
        .thinking-body h1 { font-size: 1.2em; }
        .thinking-body h2 { font-size: 1.12em; }
        .thinking-body h3 { font-size: 1.05em; }
        .thinking-body h4 { font-size: 1em; }
        .thinking-body ul,
        .thinking-body ol { margin: 6px 0; padding-left: 1.6em; }
        .thinking-body ul { list-style: disc; }
        .thinking-body ol { list-style: decimal; }
        .thinking-body li { margin: 2px 0; }
        .thinking-body code {
            background: #eef0f2;
            color: #b45309;
            padding: 1px 5px;
            border-radius: 3px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.9em;
        }
        .thinking-body pre {
            background: #eef0f2;
            padding: 10px 12px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 6px 0;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 12px;
        }
        .thinking-body pre code { background: transparent; padding: 0; }
        .thinking-body blockquote {
            margin: 6px 0;
            padding: 6px 10px;
            border-left: 3px solid #d1d5db;
            color: #6b7280;
        }
        .thinking-body a { color: #d97706; text-decoration: underline; }
        .thinking-body strong { font-weight: 600; }
        .thinking-body table {
            border-collapse: collapse;
            margin: 6px 0;
            font-size: 12px;
            width: 100%;
        }
        .thinking-body th,
        .thinking-body td {
            border: 1px solid #e5e7eb;
            padding: 4px 8px;
            text-align: left;
        }
        .thinking-body th { background: #f3f4f6; }
        .thinking-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #9ca3af;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        /* 工具调用 */
        .tool-block {
            margin: 8px 0;
            border: 1px solid #fed7aa;
            border-radius: 8px;
            background: #fff7ed;
        }
        .tool-header {
            padding: 8px 12px;
            font-size: 13px;
            color: #c2410c;
            font-weight: 500;
        }
        .tool-body {
            padding: 0 12px 10px 12px;
            font-size: 13px;
            color: #7c2d12;
            font-family: 'Monaco', 'Menlo', monospace;
        }
        /* 转接提示 */
        .transfer-block {
            margin: 8px 0;
            padding: 8px 12px;
            border-left: 3px solid #d97706;
            background: #fff7ed;
            font-size: 13px;
            color: #9a3412;
            border-radius: 4px;
        }
        /* 输入区 */
        .input-area {
            padding: 16px 24px 24px 24px;
            background: #ffffff;
            border-top: 1px solid #e5e5e5;
        }
        .input-wrapper {
            max-width: 800px;
            margin: 0 auto;
        }
        .input-box {
            display: flex;
            align-items: flex-end;
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            padding: 8px 12px;
            transition: border-color 0.2s;
        }
        .input-box:focus-within {
            border-color: #d97706;
        }
        .input-box textarea {
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            font-size: 15px;
            line-height: 1.5;
            font-family: inherit;
            background: transparent;
            max-height: 200px;
            min-height: 24px;
            padding: 6px 4px;
        }
        .input-box button {
            background: #d97706;
            color: white;
            border: none;
            border-radius: 8px;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .input-box button:hover {
            background: #b45309;
        }
        .input-box button:disabled {
            background: #d1d5db;
            cursor: not-allowed;
        }
        .input-hint {
            font-size: 12px;
            color: #9ca3af;
            text-align: center;
            margin-top: 8px;
        }
        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }
        .typing-cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background: #d97706;
            margin-left: 2px;
            animation: blink 1s infinite;
            vertical-align: middle;
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" onclick="newChat()">
                <span>+</span>
                <span>新建对话</span>
            </button>
        </div>
        <div class="chat-list" id="chatList"></div>
    </div>
    <div class="main">
        <div class="main-header">
            <div class="model-name">yichouchou_claw</div>
        </div>
        <div class="chat-container" id="chatContainer">
            <div class="message-wrapper" id="welcomeMessage">
                <div class="message">
                    <div class="avatar assistant-avatar">YC</div>
                    <div class="message-body">
                        <div class="message-header">
                            <span>yichouchou_claw</span>
                        </div>
                        <div class="message-content">你好！我是 yichouchou_claw，可以帮你查询天气、进行闲聊。请问有什么可以帮到你的？</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="input-area">
            <div class="input-wrapper">
                <div class="input-box">
                    <textarea id="queryInput" rows="1" placeholder="发送消息给 yichouchou_claw..." onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
                    <button id="sendButton" onclick="sendMessage()">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <path d="M2 8L14 8M14 8L8 2M14 8L8 14" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
                <div class="input-hint">按 Enter 发送，Shift + Enter 换行</div>
            </div>
        </div>
    </div>

    <script>
        // ============== Markdown 渲染配置 ==============
        if (typeof marked !== 'undefined') {
            marked.setOptions({
                gfm: true,
                breaks: true,
                pedantic: false,
            });
        }

        // 流式渲染节流：避免每个 token 都解析 markdown。
        function renderMarkdownInto(el, mdText, opts = {}) {
            if (!el) return;
            const { useHighlight = true } = opts;
            let html = mdText;
            try {
                if (typeof marked !== 'undefined') {
                    html = marked.parse(mdText);
                } else {
                    // 没有 marked 时退化为按行转义
                    html = '<p>' + escapeHtml(mdText) + '</p>';
                }
            } catch (e) {
                html = '<p>' + escapeHtml(mdText) + '</p>';
            }
            // DOMPurify 净化，保留常见 markdown 标签
            try {
                if (typeof DOMPurify !== 'undefined') {
                    html = DOMPurify.sanitize(html, {
                        ADD_ATTR: ['target', 'rel'],
                        ADD_TAGS: ['input'],
                    });
                }
            } catch (e) { /* 忽略 */ }
            el.innerHTML = html;
            // 处理任务列表：marked 默认会把 [ ] / [x] 渲染成 input checkbox
            el.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                cb.disabled = true;
                cb.addEventListener('click', e => e.preventDefault());
            });
            // 链接在新窗口打开
            el.querySelectorAll('a').forEach(a => {
                a.setAttribute('target', '_blank');
                a.setAttribute('rel', 'noopener noreferrer');
            });
            // 代码高亮：对每个未高亮的 <pre><code> 执行一次
            if (useHighlight && typeof hljs !== 'undefined') {
                el.querySelectorAll('pre > code').forEach(block => {
                    if (block.dataset.highlighted === 'yes') return;
                    let lang = '';
                    const m = (block.className || '').match(/language-(\S+)/);
                    if (m) lang = m[1];
                    try {
                        if (lang && hljs.getLanguage(lang)) {
                            const html2 = hljs.highlight(block.textContent, { language: lang, ignoreIllegals: true }).value;
                            block.innerHTML = html2;
                            block.classList.add('hljs');
                        } else {
                            hljs.highlightElement(block);
                        }
                    } catch (e) { /* 忽略 */ }
                    // 添加语言标签
                    if (lang && !block.parentElement.parentElement.querySelector('.code-lang')) {
                        const wrap = block.parentElement.parentElement;
                        if (wrap.classList.contains('code-block-wrapper')) {
                            const tag = document.createElement('span');
                            tag.className = 'code-lang';
                            tag.textContent = lang;
                            wrap.appendChild(tag);
                        } else {
                            // 兼容 marked 默认渲染（未包 wrapper）：包一层
                            const pre = block.parentElement;
                            if (pre && pre.tagName === 'PRE') {
                                const wrap = document.createElement('div');
                                wrap.className = 'code-block-wrapper';
                                pre.parentElement.insertBefore(wrap, pre);
                                wrap.appendChild(pre);
                                const tag = document.createElement('span');
                                tag.className = 'code-lang';
                                tag.textContent = lang;
                                wrap.appendChild(tag);
                            }
                        }
                    }
                });
            }
        }

        const chatContainer = document.getElementById('chatContainer');
        const queryInput = document.getElementById('queryInput');
        const sendButton = document.getElementById('sendButton');
        const chatList = document.getElementById('chatList');
        const welcomeMessage = document.getElementById('welcomeMessage');

        let isStreaming = false;
        let currentAssistantMsg = null;
        let currentContentEl = null;
        let currentAgentTag = null;
        let currentThinkingBlock = null;
        let currentThinkingBody = null;
        // markdown 原始 buffer 与节流定时器
        let contentMdBuffer = '';
        let thinkingMdBuffer = '';
        let renderTimer = null;
        // 当前对话的 session_id，存于 localStorage 实现跨页面刷新保持上下文。
        let sessionId = localStorage.getItem('eino_session_id') || '';

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function newChat() {
            if (isStreaming) return;
            chatContainer.innerHTML = '';
            chatContainer.appendChild(welcomeMessage);
            welcomeMessage.style.display = '';
            // 新开一个会话：清掉旧的 session_id，下次请求让服务端再分配。
            sessionId = '';
            localStorage.removeItem('eino_session_id');
        }

        function rememberSession(id) {
            if (!id) return;
            sessionId = id;
            try {
                localStorage.setItem('eino_session_id', id);
            } catch (e) {
                // localStorage 在隐私模式下可能写不进去，忽略即可。
            }
        }

        function addUserMessage(content) {
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper';
            wrapper.innerHTML = `
                <div class="message user">
                    <div class="avatar user-avatar">U</div>
                    <div class="message-body">
                        <div class="message-header">
                            <span>你</span>
                        </div>
                        <div class="message-content">${escapeHtml(content)}</div>
                    </div>
                </div>
            `;
            chatContainer.appendChild(wrapper);
            scrollToBottom();
        }

        function startAssistantMessage(agentName) {
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper';
            wrapper.innerHTML = `
                <div class="message">
                    <div class="avatar assistant-avatar">YC</div>
                    <div class="message-body">
                        <div class="message-header">
                            <span>yichouchou_claw</span>
                            <span class="agent-tag"></span>
                        </div>
                        <div class="thinking-block collapsed" style="display:none">
                            <div class="thinking-header" onclick="toggleThinking(this)">
                                <span class="thinking-icon">▶</span>
                                <span><span class="thinking-dot"></span>已深度思考</span>
                            </div>
                            <div class="thinking-body"></div>
                        </div>
                        <div class="message-content"></div>
                    </div>
                </div>
            `;
            chatContainer.appendChild(wrapper);
            currentAssistantMsg = wrapper;
            currentContentEl = wrapper.querySelector('.message-content');
            currentAgentTag = wrapper.querySelector('.agent-tag');
            currentThinkingBlock = wrapper.querySelector('.thinking-block');
            currentThinkingBody = wrapper.querySelector('.thinking-body');

            // 初始化 markdown buffer
            contentMdBuffer = '';
            thinkingMdBuffer = '';
            if (renderTimer) {
                clearTimeout(renderTimer);
                renderTimer = null;
            }

            if (agentName) {
                currentAgentTag.textContent = agentName;
            }
            scrollToBottom();
        }

        // 节流渲染：在流式输出期间，每隔 ~80ms 才真正渲染一次 markdown，
        // 避免每个 token 都触发解析与高亮造成闪烁和卡顿。
        function scheduleRender() {
            if (renderTimer) return;
            renderTimer = setTimeout(() => {
                renderTimer = null;
                // 流式期间渲染时不强制对每个代码块做高亮，结束时再补一次。
                renderMarkdownInto(currentContentEl, contentMdBuffer, { useHighlight: true });
                renderMarkdownInto(currentThinkingBody, thinkingMdBuffer, { useHighlight: true });
                scrollToBottom();
            }, 80);
        }

        function flushRender() {
            if (renderTimer) {
                clearTimeout(renderTimer);
                renderTimer = null;
            }
            renderMarkdownInto(currentContentEl, contentMdBuffer, { useHighlight: true });
            renderMarkdownInto(currentThinkingBody, thinkingMdBuffer, { useHighlight: true });
            scrollToBottom();
        }

        function appendToContent(text) {
            if (currentContentEl) {
                contentMdBuffer += text;
                scheduleRender();
            }
        }

        function appendToThinking(text) {
            if (currentThinkingBlock) {
                currentThinkingBlock.style.display = 'block';
                thinkingMdBuffer += text;
                scheduleRender();
            }
        }

        function addTransferNotice(agentName) {
            if (currentAssistantMsg) {
                const div = document.createElement('div');
                div.className = 'transfer-block';
                div.innerHTML = `🔄 任务转交给 <b>${escapeHtml(agentName)}</b> 处理`;
                currentAssistantMsg.querySelector('.message-body').appendChild(div);
                scrollToBottom();
            }
        }

        function addToolCall(toolNames) {
            if (currentAssistantMsg) {
                const div = document.createElement('div');
                div.className = 'tool-block';
                div.innerHTML = `
                    <div class="tool-header">🔧 工具调用</div>
                    <div class="tool-body">${escapeHtml(toolNames)}</div>
                `;
                currentAssistantMsg.querySelector('.message-body').appendChild(div);
                scrollToBottom();
            }
        }

        function toggleThinking(header) {
            const block = header.parentElement;
            block.classList.toggle('collapsed');
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function sendMessage() {
            const query = queryInput.value.trim();
            if (!query || isStreaming) return;

            isStreaming = true;
            sendButton.disabled = true;
            queryInput.value = '';
            queryInput.style.height = 'auto';

            welcomeMessage.style.display = 'none';
            addUserMessage(query);

            startAssistantMessage('RouterAgent');

            try {
                // 如果有 session_id 则一并传给后端，让它在该会话上累积上下文。
                const sessionParam = sessionId ? `&session_id=${encodeURIComponent(sessionId)}` : '';
                const response = await fetch(`/chat?query=${encodeURIComponent(query)}${sessionParam}`);

                if (!response.ok) {
                    appendToContent(`\n\n[请求失败: HTTP ${response.status}]`);
                    return;
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });

                    // SSE 事件以 \n\n 分隔
                    let eventEnd;
                    while ((eventEnd = buffer.indexOf('\n\n')) !== -1) {
                        const eventBlock = buffer.substring(0, eventEnd);
                        buffer = buffer.substring(eventEnd + 2);

                        // 处理事件块中的每一行
                        const lines = eventBlock.split('\n');
                        let eventData = '';
                        for (const line of lines) {
                            if (line.startsWith('data:')) {
                                eventData += line.substring(5).trim();
                            } else if (line.startsWith('event:')) {
                                // 忽略 event 字段
                            } else if (line.startsWith('id:')) {
                                // 忽略 id 字段
                            }
                        }

                        if (eventData) {
                            try {
                                const data = JSON.parse(eventData);
                                processEvent(data);
                            } catch (e) {
                                console.error('Parse error:', e, 'data:', eventData);
                            }
                        }
                    }
                }
            } catch (error) {
                appendToContent(`\n\n[请求失败: ${error.message}]`);
            } finally {
                // 流结束：做最后一次完整渲染，确保所有代码块都已高亮
                flushRender();
                isStreaming = false;
                sendButton.disabled = false;
                currentAssistantMsg = null;
                currentContentEl = null;
                currentThinkingBlock = null;
                currentThinkingBody = null;
                queryInput.focus();
            }
        }

        function processEvent(data) {
            const agentName = data.agent_name || '';

            switch (data.type) {
                case 'session':
                    // 服务端分配或回传的 session_id，用于后续多轮请求。
                    rememberSession(data.content);
                    break;

                case 'message':
                case 'stream_chunk':
                    if (data.content) {
                        // 区分思考过程和正常输出：通过 RunPath 或 content 标记
                        appendToContent(data.content);
                        if (currentAgentTag && agentName && !currentAgentTag.textContent) {
                            currentAgentTag.textContent = agentName;
                        }
                    }
                    break;

                case 'tool_result':
                case 'tool_result_chunk':
                    if (data.content) {
                        appendToThinking(`工具返回: ${data.content}\n`);
                    }
                    break;

                case 'action':
                    if (data.action_type === 'transfer' && data.content) {
                        addTransferNotice(data.content);
                    } else if (data.action_type === 'exit') {
                        // 结束
                    }
                    break;

                case 'tool_calls':
                    if (data.tool_calls && data.tool_calls.length > 0) {
                        const toolNames = data.tool_calls.map(tc => {
                            const name = tc.Function?.Name || tc.function?.name || 'unknown';
                            const args = tc.Function?.Arguments || tc.function?.arguments || '';
                            return `${name}(${args})`;
                        }).join('\n');
                        addToolCall(toolNames);
                        appendToThinking(`调用工具: ${toolNames}\n`);
                    }
                    break;

                case 'error':
                    appendToContent(`\n\n[错误: ${data.error}]`);
                    break;

                case 'end':
                    // SSE 流结束
                    console.log('SSE stream ended');
                    break;

                default:
                    // 未知事件，如果有 content 也展示出来
                    if (data.content) {
                        appendToContent(data.content);
                    }
                    console.log('Unknown event type:', data.type, data);
            }
        }
    </script>
</body>
</html>
