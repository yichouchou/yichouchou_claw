    <style>

            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {

        }
        /* 侧边栏 */
        .sidebar {

        .thinking-body > *:first-child { margin-top: 0; }
        .thinking-body > *:last-child { margin-bottom: 0; }
        .thinking-body p { margin: 6px 0; }
        .thinking-body h1,
        .thinking-body h2,
        .thinking-body h3,
        .thinking-body h4,
        .thinking-body h5,
        .thinking-body h6 { margin: 12px 0 6px; font-weight: 600; color: #374151; }
        .thinking-body h1 { font-size: 1.2em; }
        .thinking-body h2 { font-size: 1.12em; }
        .thinking-body h3 { font-size: 1.05em; }

        .thinking-body ul,
        .thinking-body ol { margin: 6px 0; padding-left: 1.6em; }
        .thinking-body ul { list-style: disc; }
        .thinking-body ol { list-style: decimal; }
        .thinking-body li { margin: 2px 0; }
        .thinking-body code {
            background: #eef0f2;
            color: #b45309;
            padding: 1px 5px;
            border-radius: 3px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.9em;
        }
        .thinking-body pre {
            background: #eef0f2;
            padding: 10px 12px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 6px 0;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 12px;
        }
        .thinking-body pre code { background: transparent; padding: 0; }
        .thinking-body blockquote {
            margin: 6px 0;
            padding: 6px 10px;
            border-left: 3px solid #d1d5db;

        }

        .thinking-body table {
            border-collapse: collapse;

        /* 输入区 */
        .input-area {
            padding: 16px 24px 24px 24px;
            background: #ffffff;

            max-width: 800px;
            margin: 0 auto;
        }
        .input-box {
            display: flex;
            align-items: flex-end;

<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" onclick="newChat()">
                <span>+</span>
                <span>新建对话</span>
            </button>
        </div>
        <div class="chat-list" id="chatList"></div>
    </div>
    <div class="main">
        <div class="main-header">
            <div class="model-name">yichouchou_claw</div>
        </div>
        <div class="chat-container" id="chatContainer">
            <div class="message-wrapper" id="welcomeMessage">
                <div class="message">
                    <div class="avatar assistant-avatar">YC</div>
                    <div class="message-body">
                        <div class="message-header">
                            <span>yichouchou_claw</span>
                        </div>
                        <div class="message-content">你好！我是 yichouchou_claw，可以帮你查询天气、进行闲聊。请问有什么可以帮到你的？</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="input-area">
            <div id="userPreview" class="user-preview" style="display: none;"></div>
            <div class="input-wrapper">
                <div class="input-box">
                    <textarea id="queryInput" rows="1" placeholder="发送消息给 yichouchou_claw... (可用 ⬆️ 上传图片/PDF/Office/文本)" onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
                    <input type="file" id="fileInput" accept="image/*,.pdf,.txt,.md,.log,.html,.htm,.docx,.xlsx,.pptx" multiple style="display: none;" onchange="handleFileSelect(event)">
                    <button id="uploadButton" onclick="document.getElementById('fileInput').click()" title="上传图片/PDF/Office/文本(支持多选)">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <path d="M8 2v12M2 8h12" stroke="#6b7280" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </button>
                    <button id="sendButton" onclick="sendMessage()">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <path d="M2 8L14 8M14 8L8 2M14 8L8 14" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
                <div class="input-hint">按 Enter 发送，Shift + Enter 换行 ｜ 上传图片/文件后会作为多模态附件</div>
            </div>
        </div>
    </div>

    <script>
        // ============== Markdown 渲染配置 ==============
        if (typeof marked !== 'undefined') {
            marked.setOptions({
                gfm: true,
                breaks: true,
                pedantic: false,
            });
        }

        // 流式渲染节流：避免每个 token 都解析 markdown。
        function renderMarkdownInto(el, mdText, opts = {}) {
            if (!el) return;
            const { useHighlight = true } = opts;
            let html = mdText;
            try {
                if (typeof marked !== 'undefined') {
                    html = marked.parse(mdText);
                } else {
                    // 没有 marked 时退化为按行转义
                    html = '<p>' + escapeHtml(mdText) + '</p>';
                }
            } catch (e) {
                html = '<p>' + escapeHtml(mdText) + '</p>';
            }
            // DOMPurify 净化，保留常见 markdown 标签
            try {
                if (typeof DOMPurify !== 'undefined') {
                    html = DOMPurify.sanitize(html, {
                        ADD_ATTR: ['target', 'rel'],
                        ADD_TAGS: ['input'],
                    });
                }
            } catch (e) { /* 忽略 */ }
            el.innerHTML = html;
            // 处理任务列表：marked 默认会把 [ ] / [x] 渲染成 input checkbox
            el.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                cb.disabled = true;
                cb.addEventListener('click', e => e.preventDefault());
            });
            // 链接在新窗口打开
            el.querySelectorAll('a').forEach(a => {
                a.setAttribute('target', '_blank');
                a.setAttribute('rel', 'noopener noreferrer');
            });
            // 代码高亮：对每个未高亮的 <pre><code> 执行一次
            if (useHighlight && typeof hljs !== 'undefined') {
                el.querySelectorAll('pre > code').forEach(block => {
                    if (block.dataset.highlighted === 'yes') return;
                    let lang = '';
                    const m = (block.className || '').match(/language-(\S+)/);
                    if (m) lang = m[1];
                    try {
                        if (lang && hljs.getLanguage(lang)) {
                            const html2 = hljs.highlight(block.textContent, { language: lang, ignoreIllegals: true }).value;
                            block.innerHTML = html2;
                            block.classList.add('hljs');
                        } else {
                            hljs.highlightElement(block);
                        }
                    } catch (e) { /* 忽略 */ }
                    // 添加语言标签
                    if (lang && !block.parentElement.parentElement.querySelector('.code-lang')) {
                        const wrap = block.parentElement.parentElement;
                        if (wrap.classList.contains('code-block-wrapper')) {
                            const tag = document.createElement('span');
                            tag.className = 'code-lang';
                            tag.textContent = lang;
                            wrap.appendChild(tag);
                        } else {
                            // 兼容 marked 默认渲染（未包 wrapper）：包一层
                            const pre = block.parentElement;
                            if (pre && pre.tagName === 'PRE') {
                                const wrap = document.createElement('div');
                                wrap.className = 'code-block-wrapper';
                                pre.parentElement.insertBefore(wrap, pre);
                                wrap.appendChild(pre);
                                const tag = document.createElement('span');
                                tag.className = 'code-lang';
                                tag.textContent = lang;
                                wrap.appendChild(tag);
                            }
                        }
                    }
                });
            }
        }

        const chatContainer = document.getElementById('chatContainer');
        const queryInput = document.getElementById('queryInput');
        const sendButton = document.getElementById('sendButton');
        const chatList = document.getElementById('chatList');
        const welcomeMessage = document.getElementById('welcomeMessage');

        let isStreaming = false;
        let currentAssistantMsg = null;
        let currentContentEl = null;
        let currentAgentTag = null;
        let currentThinkingBlock = null;
        let currentThinkingBody = null;
        // markdown 原始 buffer 与节流定时器
        let contentMdBuffer = '';
        let thinkingMdBuffer = '';
        let renderTimer = null;
        // 当前对话的 session_id，存于 localStorage 实现跨页面刷新保持上下文。
        let sessionId = localStorage.getItem('eino_session_id') || '';
        // === 多模态附件状态 (2026-07-29 新增) ===
        // 等待上传到服务端后的 URL 列表。
        let pendingImages = [];   // 图片 URL
        let pendingFiles = [];    // 通用文件 URL
        // 待本地预览的 File 对象（发完后清空）。
        let pendingLocalFiles = [];

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
        }

        // === 多模态：处理文件选择 ===
        async function handleFileSelect(event) {
            const files = Array.from(event.target.files || []);
            if (files.length === 0) return;
            for (const f of files) {
                pendingLocalFiles.push(f);
            }
            renderUserPreview();
            // 顺序上传（避免并发抢带宽/抢顺序）。每个文件上传成功后挂到 _uploadedUrl,
            // 让 removePending 能精确定位。
            for (const f of files) {
                try {
                    const url = await uploadFileToServer(f);
                    f._uploadedUrl = url;
                    if (f.type.startsWith('image/')) {
                        pendingImages.push(url);
                    } else {
                        pendingFiles.push(url);
                    }
                } catch (e) {
                    console.error('upload failed', f.name, e);
                    appendToContent(`\n\n[上传失败: ${f.name}: ${e.message}]`);
                    // 上传失败的文件留在 pendingLocalFiles(用户可见),但 pendingImages/Files 不增加
                }
            }
            renderUserPreview(); // 重新渲染以便 _uploadedUrl 标记生效(目前没用,但保持一致性)
        }

        // === 多模态：上传文件到服务端 ===
        // 默认走 POST /upload,服务端负责把文件存到 workdir/uploads/,返回 URL。
        // 失败 fallback: 用 data: URL(小文件) 或 base64。
        async function uploadFileToServer(file) {
            const fd = new FormData();
            fd.append('file', file);
            try {
                const res = await fetch('/upload', { method: 'POST', body: fd });
                if (!res.ok) throw new Error('upload http ' + res.status);
                const j = await res.json();
                if (j.url) return j.url;
                throw new Error('no url in response');
            } catch (e) {
                console.warn('[upload] fallback to data URL for', file.name, e);
                // fallback: 内联 base64(只对小文件)
                if (file.size > 2 * 1024 * 1024) {
                    throw new Error('upload failed and file too large for inline: ' + e.message);
                }
                return await new Promise((resolve, reject) => {
                    const r = new FileReader();
                    r.onload = () => resolve(r.result);
                    r.onerror = () => reject(r.error);
                    r.readAsDataURL(file);
                });
            }
        }

        // === 多模态：渲染输入区上方的预览 ===
        function renderUserPreview() {
            const el = document.getElementById('userPreview');
            if (pendingLocalFiles.length === 0) {
                el.style.display = 'none';
                el.innerHTML = '';
                return;
            }
            el.style.display = 'flex';
            el.innerHTML = '';
            pendingLocalFiles.forEach((f, idx) => {
                const item = document.createElement('div');
                item.className = 'preview-item';
                if (f.type.startsWith('image/')) {
                    const img = document.createElement('img');
                    img.src = URL.createObjectURL(f);
                    item.appendChild(img);
                } else {
                    const box = document.createElement('div');
                    box.style.cssText = 'padding:4px 10px;background:#e5e7eb;border-radius:6px;font-size:12px;';
                    box.textContent = '📎 ' + f.name;
                    item.appendChild(box);
                }
                const rm = document.createElement('div');
                rm.className = 'preview-remove';
                rm.textContent = '×';
                rm.title = '移除';
                rm.onclick = () => removePending(idx);
                item.appendChild(rm);
                el.appendChild(item);
            });
        }

        // === 多模态：移除某个待发送附件 ===
        function removePending(idx) {
            const removed = pendingLocalFiles[idx];
            if (!removed) return;
            pendingLocalFiles.splice(idx, 1);
            // 通过 _uploadedUrl 精确从 pendingImages/Files 移除
            if (removed._uploadedUrl) {
                pendingImages = pendingImages.filter(u => u !== removed._uploadedUrl);
                pendingFiles = pendingFiles.filter(u => u !== removed._uploadedUrl);
            }
            renderUserPreview();
        }

        // === 多模态：渲染一条 SSE multi_content part 到 message-body ===
        function appendMultiPart(part) {
            if (!currentAssistantMsg || !part || !part.type) return;
            const body = currentAssistantMsg.querySelector('.message-body');
            if (!body) return;
            const div = document.createElement('div');
            div.className = 'mm-part mm-part-' + part.type;
            // 把 base64 + mime 拼成 data: URL(如果 part 只给了 base64)
            const dataUrl = part.url
                || (part.base64 && part.mime
                    ? `data:${part.mime};base64,${part.base64}`
                    : null);
            switch (part.type) {
                case 'image_url':
                case 'ChatMessagePartTypeImageURL':
                    if (dataUrl) {
                        const img = document.createElement('img');
                        img.src = dataUrl;
                        img.alt = part.name || 'image';
                        img.loading = 'lazy';
                        div.appendChild(img);
                        if (part.mime) {
                            const cap = document.createElement('div');
                            cap.className = 'mm-caption';
                            cap.textContent = '🖼️ ' + part.mime;
                            div.appendChild(cap);
                        }
                    }
                    break;
                case 'file_url':
                case 'ChatMessagePartTypeFileURL':
                    if (dataUrl) {
                        const a = document.createElement('a');
                        a.href = dataUrl;
                        // data: URL 强制触发下载而不是跳转
                        if (dataUrl.startsWith('data:')) {
                            a.download = part.name || 'attachment';
                        } else {
                            a.target = '_blank';
                            a.rel = 'noopener';
                        }
                        a.textContent = '📎 ' + (part.name || '附件');
                        div.appendChild(a);
                        if (part.mime) {
                            const meta = document.createElement('span');
                            meta.className = 'mm-meta';
                            meta.textContent = ' (' + part.mime + ')';
                            div.appendChild(meta);
                        }
                    }
                    break;
                case 'audio_url':
                case 'ChatMessagePartTypeAudioURL':
                    if (dataUrl) {
                        const audio = document.createElement('audio');
                        audio.src = dataUrl;
                        audio.controls = true;
                        div.appendChild(audio);
                    }
                    break;
                case 'video_url':
                case 'ChatMessagePartTypeVideoURL':
                    if (dataUrl) {
                        const video = document.createElement('video');
                        video.src = dataUrl;
                        video.controls = true;
                        div.appendChild(video);
                    }
                    break;
                default:
                    // 未知类型,只显示 type 信息
                    div.textContent = '[' + part.type + ']';
            }
            body.appendChild(div);
            scrollToBottom();
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function newChat() {
            if (isStreaming) return;
            chatContainer.innerHTML = '';
            chatContainer.appendChild(welcomeMessage);
            welcomeMessage.style.display = '';
            // 新开一个会话：清掉旧的 session_id，下次请求让服务端再分配。
            sessionId = '';
            localStorage.removeItem('eino_session_id');
        }

        function rememberSession(id) {
            if (!id) return;
            sessionId = id;
            try {
                localStorage.setItem('eino_session_id', id);
            } catch (e) {
                // localStorage 在隐私模式下可能写不进去，忽略即可。
            }
        }

        function addUserMessage(content, attachments) {
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper';
            const attachmentsHtml = buildUserAttachmentsHtml(attachments);
            wrapper.innerHTML = `
                <div class="message user">
                    <div class="avatar user-avatar">U</div>
                    <div class="message-body">
                        <div class="message-header">
                            <span>你</span>
                        </div>
                        <div class="message-content">${escapeHtml(content)}</div>
                        ${attachmentsHtml}
                    </div>
                </div>
            `;
            chatContainer.appendChild(wrapper);
            scrollToBottom();
        }

        // === 多模态：构造用户消息里的附件展示 HTML ===
        function buildUserAttachmentsHtml(attachments) {
            if (!attachments) return '';
            const imgs = (attachments.images || []);
            const files = (attachments.files || []);
            if (imgs.length === 0 && files.length === 0) return '';
            const imgHtml = imgs.map(u =>
                `<img class="user-attach-thumb" src="${escapeHtml(u)}" loading="lazy" alt="image">`
            ).join('');
            const fileHtml = files.map(u => {
                const name = u.split('/').pop() || u;
                return `<a class="user-attach-file" href="${escapeHtml(u)}" target="_blank" rel="noopener">📎 ${escapeHtml(name)}</a>`;
            }).join('');
            return `<div class="user-attachments">${imgHtml}${fileHtml}</div>`;
        }

        function startAssistantMessage(agentName) {
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper';
            wrapper.innerHTML = `
                <div class="message">
                    <div class="avatar assistant-avatar">YC</div>
                    <div class="message-body">
                        <div class="message-header">
                            <span>yichouchou_claw</span>
                            <span class="agent-tag"></span>
                        </div>
                        <div class="thinking-block collapsed" style="display:none">
                            <div class="thinking-header" onclick="toggleThinking(this)">
                                <span class="thinking-icon">▶</span>
                                <span><span class="thinking-dot"></span>已深度思考</span>
                            </div>
                            <div class="thinking-body"></div>
                        </div>
                        <div class="message-content"></div>
                    </div>
                </div>
            `;
            chatContainer.appendChild(wrapper);
            currentAssistantMsg = wrapper;
            currentContentEl = wrapper.querySelector('.message-content');
            currentAgentTag = wrapper.querySelector('.agent-tag');
            currentThinkingBlock = wrapper.querySelector('.thinking-block');
            currentThinkingBody = wrapper.querySelector('.thinking-body');

            // 初始化 markdown buffer
            contentMdBuffer = '';
            thinkingMdBuffer = '';
            if (renderTimer) {
                clearTimeout(renderTimer);
                renderTimer = null;
            }

            if (agentName) {
                currentAgentTag.textContent = agentName;
            }
            scrollToBottom();
        }

        // 节流渲染：在流式输出期间，每隔 ~80ms 才真正渲染一次 markdown，
        // 避免每个 token 都触发解析与高亮造成闪烁和卡顿。
        function scheduleRender() {
            if (renderTimer) return;
            renderTimer = setTimeout(() => {
                renderTimer = null;
                // 流式期间渲染时不强制对每个代码块做高亮，结束时再补一次。
                renderMarkdownInto(currentContentEl, contentMdBuffer, { useHighlight: true });
                renderMarkdownInto(currentThinkingBody, thinkingMdBuffer, { useHighlight: true });
                scrollToBottom();
            }, 80);
        }

        function flushRender() {
            if (renderTimer) {
                clearTimeout(renderTimer);
                renderTimer = null;
            }
            renderMarkdownInto(currentContentEl, contentMdBuffer, { useHighlight: true });
            renderMarkdownInto(currentThinkingBody, thinkingMdBuffer, { useHighlight: true });
            scrollToBottom();
        }

        function appendToContent(text) {
            if (currentContentEl) {
                contentMdBuffer += text;
                scheduleRender();
            }
        }

        function appendToThinking(text) {
            if (currentThinkingBlock) {
                currentThinkingBlock.style.display = 'block';
                thinkingMdBuffer += text;
                scheduleRender();
            }
        }

        function addTransferNotice(agentName) {
            if (currentAssistantMsg) {
                const div = document.createElement('div');
                div.className = 'transfer-block';
                div.innerHTML = `🔄 任务转交给 <b>${escapeHtml(agentName)}</b> 处理`;
                currentAssistantMsg.querySelector('.message-body').appendChild(div);
                scrollToBottom();
            }
        }

        function addToolCall(toolNames) {
            if (currentAssistantMsg) {
                const div = document.createElement('div');
                div.className = 'tool-block';
                div.innerHTML = `
                    <div class="tool-header">🔧 工具调用</div>
                    <div class="tool-body">${escapeHtml(toolNames)}</div>
                `;
                currentAssistantMsg.querySelector('.message-body').appendChild(div);
                scrollToBottom();
            }
        }

        function toggleThinking(header) {
            const block = header.parentElement;
            block.classList.toggle('collapsed');
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function sendMessage() {
            const query = queryInput.value.trim();
            if (!query || isStreaming) return;

            isStreaming = true;
            sendButton.disabled = true;
            queryInput.value = '';
            queryInput.style.height = 'auto';

            welcomeMessage.style.display = 'none';
            // === 多模态：把待发送的附件缩略图也放进用户消息(可选) ===
            addUserMessage(query, { images: pendingImages.slice(), files: pendingFiles.slice() });

            startAssistantMessage('RouterAgent');

            try {
                // 如果有 session_id 则一并传给后端，让它在该会话上累积上下文。
                // === 修复: sessionQuery 用 ? 起始(POST + body 模式,query string 在 URL) ===
                const sessionQuery = sessionId ? `?session_id=${encodeURIComponent(sessionId)}` : '';
                // === 多模态: 彻底改 POST + JSON body(2026-07-29 修复) ===
                //
                // 关键修复: 不要在 HTTP Header 里传 base64/data URL。
                //   - Header 单行: base64 可能含换行被截断
                //   - Header 字符限制: + / = 等字符可能被某些框架特殊处理
                //   - Header 长度限制: base64 一般 > 8KB,可能超过 header 大小
                //   - 单行长度受限
                // 我们改成 POST + JSON body,把 image_data[](base64) + image_mime[]
                // + image_url[] (http(s) 或相对路径) 单独字段传。后端在 /chat
                // handler 里 BindAndValidate 读 body,完全不进 header。
                //
                const requestBody = {
                    query: query,
                    session_id: sessionId || undefined,
                    // === 多模态字段 ===
                    image_data: [],
                    image_mime: [],
                    image_url: [],   // http(s) URL(未来对接对象存储)
                    file_data: [],
                    file_mime: [],
                    file_name: [],
                    file_url: [],
                };
                pendingImages.forEach(u => {
                    if (u.startsWith('data:')) {
                        const m = u.match(/^data:([^;]+);base64,(.+)$/);
                        if (m) {
                            requestBody.image_data.push(m[2]);
                            requestBody.image_mime.push(m[1]);
                        } else {
                            console.warn('malformed data URL skipped:', u.slice(0, 50));
                        }
                    } else if (u.startsWith('http://') || u.startsWith('https://')) {
                        requestBody.image_url.push(u);
                    } else {
                        // 相对路径 /uploads/xxx → 后端从磁盘读 base64
                        requestBody.image_url.push(u);
                    }
                });
                pendingFiles.forEach(u => {
                    if (u.startsWith('data:')) {
                        const m = u.match(/^data:([^;]+);base64,(.+)$/);
                        if (m) {
                            requestBody.file_data.push(m[2]);
                            requestBody.file_mime.push(m[1]);
                            requestBody.file_name.push('attachment');
                        } else {
                            console.warn('malformed data URL skipped:', u.slice(0, 50));
                        }
                    } else if (u.startsWith('http://') || u.startsWith('https://')) {
                        requestBody.file_url.push(u);
                    } else {
                        requestBody.file_url.push(u);
                    }
                });
                // POST + JSON body
                const response = await fetch(`/chat${sessionQuery}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody),
                });

                if (!response.ok) {
                    appendToContent(`\n\n[请求失败: HTTP ${response.status}]`);
                    return;
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });

                    // SSE 事件以 \n\n 分隔
                    let eventEnd;
                    while ((eventEnd = buffer.indexOf('\n\n')) !== -1) {
                        const eventBlock = buffer.substring(0, eventEnd);
                        buffer = buffer.substring(eventEnd + 2);

                        // 处理事件块中的每一行
                        const lines = eventBlock.split('\n');
                        let eventData = '';
                        for (const line of lines) {
                            if (line.startsWith('data:')) {
                                eventData += line.substring(5).trim();
                            } else if (line.startsWith('event:')) {
                                // 忽略 event 字段
                            } else if (line.startsWith('id:')) {
                                // 忽略 id 字段
                            }
                        }

                        if (eventData) {
                            try {
                                const data = JSON.parse(eventData);
                                processEvent(data);
                            } catch (e) {
                                console.error('Parse error:', e, 'data:', eventData);
                            }
                        }
                    }
                }
            } catch (error) {
                appendToContent(`\n\n[请求失败: ${error.message}]`);
            } finally {
                // 流结束：做最后一次完整渲染，确保所有代码块都已多模态高亮
                flushRender();
                isStreaming = false;
                sendButton.disabled = false;
                currentAssistantMsg = null;
                currentContentEl = null;
                currentThinkingBlock = null;
                currentThinkingBody = null;
                // === 多模态：清空本轮附件状态（2026-07-29 新增） ===
                pendingImages = [];
                pendingFiles = [];
                pendingLocalFiles = [];
                renderUserPreview();
                queryInput.focus();
            }
        }

        function processEvent(data) {
            const agentName = data.agent_name || '';

            switch (data.type) {
                case 'session':
                    // 服务端分配或回传的 session_id，用于后续多轮请求。
                    rememberSession(data.content);
                    break;

                case 'message':
                case 'stream_chunk':
                    if (data.content) {
                        // 区分思考过程和正常输出：通过 RunPath 或 content 标记
                        appendToContent(data.content);
                        if (currentAgentTag && agentName && !currentAgentTag.textContent) {
                            currentAgentTag.textContent = agentName;
                        }
                    }
                    // === 多模态 part 渲染（2026-07-29 新增） ===
                    if (Array.isArray(data.multi_content) && data.multi_content.length > 0) {
                        data.multi_content.forEach(p => appendMultiPart(p));
                    }
                    break;

                case 'tool_result':
                case 'tool_result_chunk':
                    if (data.content) {
                        appendToThinking(`工具返回: ${data.content}\n`);
                    }
                    break;

                case 'action':
                    if (data.action_type === 'transfer' && data.content) {
                        addTransferNotice(data.content);
                    } else if (data.action_type === 'exit') {
                        // 结束
                    }
                    break;

                case 'tool_calls':
                    if (data.tool_calls && data.tool_calls.length > 0) {
                        const toolNames = data.tool_calls.map(tc => {
                            const name = tc.Function?.Name || tc.function?.name || 'unknown';
                            const args = tc.Function?.Arguments || tc.function?.arguments || '';
                            return `${name}(${args})`;
                        }).join('\n');
                        addToolCall(toolNames);
                        appendToThinking(`调用工具: ${toolNames}\n`);
                    }
                    break;

                case 'error':
                    appendToContent(`\n\n[错误: ${data.error}]`);
                    break;

                case 'end':
                    // SSE 流结束
                    console.log('SSE stream ended');
                    break;

                default:
                    // 未知事件，如果有 content 也展示出来
                    if (data.content) {
                        appendToContent(data.content);
                    }
                    console.log('Unknown event type:', data.type, data);
            }
        }
    </script>
</body>
</html>
