# yichouchou_claw 统一配置文件
#
# 加载顺序：
#   1. 应用启动时加载本文件到 internal/config.ApplicationConfig
#   2. 各模块从全局配置对象读取
#   3. 环境变量仍可覆盖敏感字段（API Key / Token）
#
# 注：API Key 等敏感字段建议用环境变量注入，不要直接写入此文件。

server:
  # HTTP 服务监听端口
  host: ":28080"

# LLM 配置
# MODEL_TYPE 决定走哪个 ChatModel 实现：
#   - "ark"          → 火山方舟（Ark SDK）
#   - "anthropic"    → Anthropic SDK（默认；支持 Minimaxi 兼容端点 + 服务端工具）
#   - 其他/空         → OpenAI 兼容协议
llm:
  type: "anthropic"

  # === OpenAI 兼容配置 ===
  openai:
    api_key: ""           # 也可从 env OPENAI_API_KEY 读取
    model: ""             # 也可从 env OPENAI_MODEL 读取
    base_url: ""          # 也可从 env OPENAI_BASE_URL 读取
    by_azure: false       # 是否走 Azure OpenAI（OPENAI_BY_AZURE=true）

  # === Ark（火山方舟）配置 ===
  ark:
    api_key: ""           # 也可从 env ARK_API_KEY 读取
    model: ""             # 也可从 env ARK_MODEL 读取
    base_url: ""          # 也可从 env ARK_BASE_URL 读取

  # === Anthropic 配置（用于 ChatAgent + Minimaxi web_search 服务端工具）===
  anthropic:
    api_key: ""           # 也可从 env ANTHROPIC_API_KEY 或 OPENAI_API_KEY 读取
    model: "MiniMax-M3"   # 默认模型名
    base_url: "https://api.minimaxi.com/anthropic"  # Minimaxi Anthropic 兼容端点
    max_tokens: 4096
    # 是否启用服务端工具 web_search（Minimaxi web_search_20250305）
    enable_web_search: true

# CozeLoop（可选 trace）
tracing:
  coze_loop:
    enabled: false        # 是否启用 CozeLoop trace
    workspace_id: ""      # COZELOOP_WORKSPACE_ID
    api_token: ""         # COZELOOP_API_TOKEN

# 工作目录与资源路径（相对于 workdir 根目录或绝对路径）
paths:
  workdir: "workdir"                     # workdir 根目录（默认 ./workdir）
  skills: "workdir/skills"               # skills 目录
  memory: "workdir"                      # memory 输出根（其下生成 memory/{sessions,inputs,outputs,errors}）
  approvals: "workdir/config/exec-approvals.json"  # 命令执行审批配置

# Memory（会话 trace 落盘）
memory:
  enabled: true                              # 也可从 env YICHOUCHOU_MEMORY=off 关闭
  llm_refine_enabled: true                    # 也可从 env YICHOUCHOU_LLM_REFINE=off 关闭
  refiner:
    workers: 2                               # LLM 摘要精炼 worker 数
    queue_size: 256                          # 精炼任务 channel 缓冲
    per_call_timeout_seconds: 30             # 单次 LLM refine 超时
    content_snippet_bytes: 1500              # 喂给 LLM 的内容长度上限
    model_temperature: 0.2                   # refine 用低温度
    max_summary_length: 100                  # 摘要硬上限（字符数）

  # 最近记忆自动注入（D 方案，2026-07-27 新增）
  # 设计参考 Claude Code CLAUDE.md 机制：把最近 N 条记忆直接灌到 ChatAgent
  # 的 system prompt，让模型无需主动调 memory_search 就能"感知"到近期讨论。
  # 触发率提升的最大杠杆点。
  recent_memory:
    enabled: true                            # 总开关；设为 false 则不注入（保持极简 prompt）
    limit: 10                                # 注入多少条最近记忆（推荐 5-20）
    max_tokens: 2000                         # 注入文本字符上限（粗略估算，到达上限自动裁剪）
    max_age_days: 30                         # 最远多少天内的记忆会被注入
    kinds_filter:                            # 注入这些 kind 的记忆
      - user_request                          # 默认：只显示"用户问过什么"
      # - user_response                       # 可选追加：包含模型回答

# Session（对话历史）
session:
  max_rounds: 12                             # 每个 session 保留最近多少轮（一问一答算 1 轮）

# LocalCommand（沙箱命令执行）
localcommand:
  single_command_timeout_seconds: 30         # 单条命令超时
  pipeline_command_timeout_seconds: 60        # 管道命令链超时

# Agent 运行时参数（2026-07-29 新增）
# 统一控制 Agent 维度的可调参数。
#
#   - max_iterations: 通用 ChatModelAgent.Run 循环上限,作为 per_agent 兜底
#   - per_agent_max_iterations: 按 agent 名单独覆盖,优先级更高
#   - total_run_timeout_seconds: 整个 run 兜底超时(main.go 侧 context.WithTimeout)
#
# 单次 ChatModelAgent.Run 内部 "调 ChatModel → 工具 → 观察" 循环上限。
# 触顶会报 "exceeds max iterations" 整个 run 失败。
#
# 注意：单条沙箱命令超时由 localcommand.single_command_timeout_seconds 控制
#（属于 localcommand 包运行参数，不属于 agent 层面的可调项）。
#
# 设计取舍：
#   - 默认 20（eino 框架默认，对 ChatAgent / WeatherAgent 够用）
#   - 本机排障常需要 7+ 步（DNS → 代理 → 测 github → 测 baidu → 换镜像 → 重试），
#     默认 50 留足余量
#   - 0 = 让 eino 用框架默认 20（不建议）
agent:
  max_iterations: 50                          # 通用兜底
  per_agent_max_iterations:                   # 各 agent 单独控制
    local_command: 50                         # 排障: 7+ 步是常态
    chat: 20                                  # 闲聊不需要多轮
    weather: 20                               # 天气查询 1 次就够
    router: 30                                # 路由 + 偶尔查 memory
  total_run_timeout_seconds: 600              # 整个 run 兜底（10 分钟）

# Sandbox 安全（2026-07-27 新增，整合四个安全阶段）
#
# 设计参考：
#   - Claude Code:  deny → ask → allow 三段评估
#   - OpenAI Codex: denybin PATH 注入（OS 层 defense-in-depth）
#   - mvdan.cc/sh:  AST 解析作为 shell 命令的唯一可信源
#   - safecmd:      AST 提取 + 逐 CallExpr 验证
#
# 四个安全阶段（按评估顺序）：
#   1. AST 解析：mvdan.cc/sh 解析命令为 AST,递归检查每个 CallExpr/Redirect
#   2. deny → ask → allow 三段：显式评估链路,清晰展示拒绝原因
#   3. PathACL：read/write 分开的敏感路径 ACL（read 立即拒绝, write 配合 AST Redirect 检查）
#   4. denybin PATH 注入：把 deny 命令的真实二进制隐藏到 PATH 末尾（OS 层兜底）
sandbox:
  enabled: true                                # 是否启用沙箱安全检查（false = 极不安全）

  # 阶段 1: AST 解析
  ast:
    enabled: true                              # 是否启用 mvdan.cc/sh AST 解析
    fail_closed_on_parse_error: true           # AST 解析失败时直接拒绝（fail-closed）

  # 阶段 2: denybin PATH 注入
  denybin:
    enabled: true                              # 是否创建 denybin 目录并插入 PATH 最前端
    # denied_commands: 为空时使用 path_acl.exec_denied；都为空时使用内置默认
    denied_commands: []

  # 阶段 3+4: 路径 ACL（read/write/exec 三类）
  path_acl:
    # 禁止读取的路径前缀（命中即拒绝,与命令白名单无关）
    read_denied:
      - /etc/shadow
      - /etc/sudoers
      - /etc/gshadow
      - /root/.ssh
      - /root/.bash_history
      - ~/.ssh/id_rsa
      - ~/.aws/credentials
      - ~/.kube/config
    # 禁止写入的路径前缀（被 AST Redirect 检查命中即拒绝）
    write_denied:
      - /etc
      - /usr
      - /boot
      - /proc
      - /sys
      - /var/lib
    # 禁止执行的命令名（被 denybin PATH 注入 + IsDangerousWithAgentV2 deny 阶段命中即拒绝）
    exec_denied:
      # 网络类
      - nc
      - nmap
      # 权限修改类
      - chmod
      - chown
      - setcap
      - setfattr
      # 磁盘与分区类
      - dd
      - mkfs
      - fdisk
      - parted

# Memory 中间件 trace 容量
# 注：anthropic adapter 的 max_tokens 已在上方 llm.anthropic.max_tokens 配置